plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}
version = mod_version
group = mod_group_id
base { archivesName = "arcadia-dungeon-neoforge-${minecraft_version}" }

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    mods { "arcadia_dungeon" { sourceSet(sourceSets.main) } }

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }
}

dependencies {
    // Arcadia Lib, for the hub card and the panel protocol. This mod ships no client class
    // and draws nothing itself: it describes a panel and the lib renders it on whatever
    // client is connected, which is why the dependency is enough and no client source is.
    compileOnly fileTree(dir: 'libs', include: ['arcadia-lib-*.jar'])
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar { manifest { attributes 'Implementation-Version': project.version } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// -- Dev runs find the lib jar by themselves --------------------------------------------------
// arcadia-lib is not registered as a mod of this project, so a dev run stops on the required
// arcadia_lib dependency until its jar sits in the run directory's mods/ folder. That used to be
// a line in a comment asking for a manual copy, and the manual copy never happened: the dedicated
// server had never been started on this target at all, on any target of any dependent mod. A
// build step does it now, because a build step runs and a comment does not.
//
// Only one jar is left in place. Two versions of the same mod id in mods/ is a duplicate-mod
// crash, and libs/ keeps older builds around on purpose.
def arcadiaLibJars = fileTree(dir: 'libs', include: ['arcadia-lib-*.jar'])
tasks.register('deployArcadiaLib') {
    group = 'arcadia'
    description = 'Copies the newest arcadia-lib jar from libs/ into each run directory.'
    def jars = arcadiaLibJars
    def dirs = ['run/client', 'run/server']
    def root = projectDir
    inputs.files jars
    outputs.upToDateWhen { false }
    doLast {
        def newest = jars.files.findAll { it.isFile() }.max { it.lastModified() }
        if (newest == null) {
            logger.warn('[arcadia] no arcadia-lib jar in libs/: a dev run will stop on the '
                    + 'required arcadia_lib dependency. Build the lib and drop its jar there.')
            return
        }
        dirs.each { String name ->
            File mods = new File(root, name + '/mods')
            mods.mkdirs()
            mods.listFiles()?.each { File old ->
                if (old.name.startsWith('arcadia-lib-') && old.name.endsWith('.jar')
                        && old.name != newest.name) {
                    old.delete()
                }
            }
            java.nio.file.Files.copy(newest.toPath(), new File(mods, newest.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("[arcadia] ${newest.name} -> ${name}/mods/")
        }
    }
}
tasks.configureEach {
    if (name in ['runClient', 'runServer', 'runGameTestServer', 'runData']) {
        dependsOn 'deployArcadiaLib'
    }
}

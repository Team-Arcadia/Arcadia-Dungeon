modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/vyrriox/Arcadia"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# arcadia-lib is not optional: ArcadiaDungeon registers its hub card into the lib's registry
# while the mod is being constructed, and the dungeon panel imports the lib's panel protocol
# directly. Without this, a modpack carrying an old lib crashes on a missing class instead of
# saying which mod is too old.
[[dependencies.${mod_id}]]
    modId="arcadia_lib"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

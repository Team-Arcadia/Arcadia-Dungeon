org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true

# Forge 1.20.1 port (the NeoForge 1.21.1 build is the reference).
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# Compile against an EARLY 1.20.1 Forge so we never use APIs added in later 47.x patches
# that would crash on the Forge build players actually run.
forge_version=47.1.0
forge_version_range=[47,)
loader_version_range=[47,)

mod_id=arcadia_dungeon
mod_name=Arcadia Dungeon
mod_license=All Rights Reserved
mod_version=2.0.0
mod_group_id=com.vyrriox.arcadiadungeon
mod_authors=vyrriox
mod_description=Fully configurable dungeon system with adaptive bosses, phases, rewards, cooldowns and chat announcements. Server-friendly!

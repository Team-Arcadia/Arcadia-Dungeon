plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

// Loader-independent code for this Minecraft version lives in ../common on the main branch.
// On the per-target branches it is merged into src/main, so this block does nothing there.
def commonDir = file("../common/${minecraft_version}/src/main")
if (commonDir.isDirectory()) {
    sourceSets.main.java.srcDir(new File(commonDir, 'java'))
    sourceSets.main.resources.srcDir(new File(commonDir, 'resources'))
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTests (run with ./gradlew runGameTestServer). Compiled against main, never packaged.
// The gameTestServer run was already declared and had nothing to run: the mod had no tests.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        modSource project.sourceSets.gametest
        // 'neoforge.', not 'forge.': NeoForge 21 reads the first and ignores the second, so the
        // namespace was never enabled and the run would have found no tests even with some.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Arcadia Lib, for the hub card and the panel protocol. Compile only in spirit: this mod
    // ships no client class and draws nothing itself, it describes a panel and the lib renders
    // it on whatever client is connected.
    implementation fileTree(dir: 'libs', include: ['arcadia-lib-*.jar'])
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// -- Dev runs find the lib jar by themselves --------------------------------------------------
// arcadia-lib is not registered as a mod of this project, so a dev run stops on the required
// arcadia_lib dependency until its jar sits in the run directory's mods/ folder. That used to be
// a line in a comment asking for a manual copy, and the manual copy never happened: the dedicated
// server had never been started on this target at all, on any target of any dependent mod. A
// build step does it now, because a build step runs and a comment does not.
//
// Only one jar is left in place. Two versions of the same mod id in mods/ is a duplicate-mod
// crash, and libs/ keeps older builds around on purpose.
def arcadiaLibJars = fileTree(dir: 'libs', include: ['arcadia-lib-*.jar'])
tasks.register('deployArcadiaLib') {
    group = 'arcadia'
    description = 'Copies the newest arcadia-lib jar from libs/ into each run directory.'
    def jars = arcadiaLibJars
    def dirs = ['run']
    def root = projectDir
    inputs.files jars
    outputs.upToDateWhen { false }
    doLast {
        def newest = jars.files.findAll { it.isFile() }.max { it.lastModified() }
        if (newest == null) {
            logger.warn('[arcadia] no arcadia-lib jar in libs/: a dev run will stop on the '
                    + 'required arcadia_lib dependency. Build the lib and drop its jar there.')
            return
        }
        dirs.each { String name ->
            File mods = new File(root, name + '/mods')
            mods.mkdirs()
            mods.listFiles()?.each { File old ->
                if (old.name.startsWith('arcadia-lib-') && old.name.endsWith('.jar')
                        && old.name != newest.name) {
                    old.delete()
                }
            }
            java.nio.file.Files.copy(newest.toPath(), new File(mods, newest.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("[arcadia] ${newest.name} -> ${name}/mods/")
        }
    }
}
tasks.configureEach {
    if (name in ['runClient', 'runServer', 'runGameTestServer', 'runData']) {
        dependsOn 'deployArcadiaLib'
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
    gametestCompileOnly.extendsFrom compileOnly
}

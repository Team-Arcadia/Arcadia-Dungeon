<col class="admin-hub">

  <row class="hub-header">
    <label class="hub-title">⚙ Admin — Donjons</label>
    <label class="hub-stat">{{ dungeon.count }} donjon(s)</label>
  </row>

  <row class="hub-toolbar">
    <input class="search-field" placeholder="Filtrer..." oninput="filter" />
    <button class="btn-create" onclick="create">+ Créer</button>
  </row>

  <col class="hub-list">
    <col v-for="d in dungeon.filtered" class="dungeon-row">
      <row class="row-inner">
        <label class="row-status {{ d.status-class }}">{{ d.status }}</label>
        <col class="row-info">
          <label class="row-name">{{ d.name }}</label>
          <label class="row-id muted">{{ d.id }} · schema {{ d.schema }}</label>
        </col>
        <button class="btn-manage" onclick="{{ d.manage-key }}">Gérer →</button>
      </row>
    </col>
    <label class="empty-hint" v-show="filter.hint">{{ filter.hint }}</label>
  </col>

  <row class="hub-footer">
    <button class="btn-reload" onclick="reload">⟳ Recharger</button>
    <button class="btn-close"  onclick="close">Fermer</button>
  </row>

</col>

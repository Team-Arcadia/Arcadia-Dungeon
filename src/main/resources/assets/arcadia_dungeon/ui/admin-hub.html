<col class="admin-hub">
  <!-- ── Header ── -->
  <row class="hub-header">
    <label class="hub-title" data-i18n="arcadia.admin.hub.title">⚙ Admin — Donjons</label>
    <label class="hub-stat">{{ dungeon.count }}</label>
  </row>

  <!-- ── Toolbar ── -->
  <row class="hub-toolbar">
    <input id="search"
           class="search-field"
           placeholder="Filtrer..."
           oninput="filter"
           tooltip-i18n="arcadia.admin.hub.tooltip.filter" />
    <button class="btn-create"
            onclick="create"
            tooltip-i18n="arcadia.admin.hub.tooltip.create"
            data-i18n="arcadia.admin.hub.create">+ Créer</button>
  </row>

  <!-- ── Dungeon list ── -->
  <col class="hub-list" oncontextmenu="ctxList">
    <virtual-list class="hub-vlist" v-for="d in dungeon.filtered" row-height="28">
      <row class="dungeon-row" oncontextmenu="{{ d.ctxKey }}">
        <label class="status-dot {{ d.statusClass }}">■</label>
        <col class="row-info">
          <label class="row-name">{{ d.name }}</label>
          <label class="row-meta">{{ d.id }} · {{ d.schema }}</label>
        </col>
        <button class="btn-manage"
                onclick="{{ d.manageKey }}"
                tooltip-i18n="arcadia.admin.hub.tooltip.manage">Gérer →</button>
      </row>
    </virtual-list>
    <label class="empty-hint" v-if="filter.hint">{{ filter.hint }}</label>
  </col>

  <!-- ── Footer ── -->
  <row class="hub-footer">
    <button class="btn-reload"
            onclick="reload"
            tooltip-i18n="arcadia.admin.hub.tooltip.reload"
            data-i18n="arcadia.admin.hub.reload">⟳ Recharger</button>
    <button class="btn-monitor"
            onclick="monitor"
            tooltip-i18n="arcadia.admin.hub.tooltip.monitor">◉ Monitor</button>
    <button class="btn-close"
            onclick="close"
            data-i18n="arcadia.admin.hub.close">Fermer</button>
  </row>

</col>

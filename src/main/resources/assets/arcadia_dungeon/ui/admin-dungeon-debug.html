<col class="cfg-screen">
  <row class="cfg-header">
    <label class="cfg-title">{{ cfg.title }}</label>
  </row>

  <col class="cfg-body">

    <label class="section-title" data-i18n="arcadia.admin.debug.active.runs">Runs actives</label>

    <label class="cfg-note" v-if="debug.empty"
           data-i18n="arcadia.admin.debug.none">Aucune run active.</label>

    <label class="cfg-note" v-show="debug.summary">{{ debug.summary }}</label>

    <!-- Danger zone -->
    <col class="danger-zone">
      <label class="danger-title">âš  Danger Zone</label>
      <button class="btn-danger"
              onclick="killAll"
              tooltip-i18n="arcadia.admin.debug.tooltip.kill"
              data-i18n="arcadia.admin.debug.kill.all">âš  Tuer toutes les runs</button>
    </col>

  </col>

  <row class="cfg-footer">
    <button class="btn-back" onclick="back" data-i18n="arcadia.admin.debug.back">â† Retour</button>
  </row>

</col>

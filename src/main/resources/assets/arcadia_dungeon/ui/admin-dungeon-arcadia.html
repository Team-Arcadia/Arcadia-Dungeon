<col class="cfg-screen">
  <row class="cfg-header">
    <label class="cfg-title">{{ cfg.title }}</label>
  </row>

  <col class="cfg-body">

    <!-- XP multiplier -->
    <col class="field-group">
      <label class="field-label" data-i18n="arcadia.admin.arcadia.xp.multi">Multiplicateur XP</label>
      <input id="xpMulti"
             class="field-input"
             placeholder="1.0"
             value="{{ v.xpMulti }}"
             oninput="onXpMulti"
             tooltip-i18n="arcadia.admin.arcadia.tooltip.xp" />
    </col>

    <!-- Required level -->
    <col class="field-group">
      <label class="field-label" data-i18n="arcadia.admin.arcadia.req.level">Niveau requis</label>
      <input id="reqLevel"
             class="field-input"
             placeholder="0"
             value="{{ v.reqLevel }}"
             oninput="onReqLevel"
             tooltip-i18n="arcadia.admin.arcadia.tooltip.level" />
    </col>

  </col>

  <row class="cfg-footer">
    <button class="btn-back" onclick="back" data-i18n="arcadia.admin.arcadia.back">â† Retour</button>
    <col class="spacer" />
    <button class="btn-save" onclick="save" data-i18n="arcadia.admin.arcadia.save">âœ” Sauvegarder</button>
  </row>

</col>

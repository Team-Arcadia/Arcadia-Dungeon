<col class="detail-screen">
  <!-- ── Header ── -->
  <row class="detail-header">
    <button class="btn-back" onclick="back" tooltip="Retour à la liste">←</button>
    <label class="detail-title">{{ dungeon.name }}</label>
    <badge class="schema-badge" tooltip="Version du schéma JSON">{{ dungeon.schema }}</badge>
    <button class="btn-refresh" onclick="refresh" tooltip="Recharger depuis le serveur">⟳</button>
  </row>

  <!-- ── Tabs (les clés affichent "…" / "—" pendant le chargement) ── -->
  <tabs class="detail-tabs">

    <tab label="Core">
      <col class="tab-body">
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.id">ID</label>
          <label class="info-val mono">{{ dungeon.id }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.lives">Vies</label>
          <label class="info-val">{{ dungeon.lives }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.structure">Structure NBT</label>
          <label class="info-val mono">{{ dungeon.struct }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.dimension">Dimension</label>
          <label class="info-val mono">{{ dungeon.dim }}</label>
        </row>
      </col>
    </tab>

    <tab label="Boss">
      <col class="tab-body">
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.boss.count">Boss</label>
          <label class="info-val">{{ boss.count }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.boss.type">Entité</label>
          <label class="info-val mono">{{ boss.type }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.boss.hp">Points de vie</label>
          <label class="info-val">{{ boss.hp }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.boss.phases">Phases</label>
          <label class="info-val">{{ boss.phases }}</label>
        </row>
      </col>
    </tab>

    <tab label="Rooms">
      <col class="tab-body">
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.rooms">Salles</label>
          <label class="info-val">{{ rooms.count }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.waves">Vagues</label>
          <label class="info-val">{{ rooms.waves }}</label>
        </row>
        <label class="tab-note">
          Les détails par salle se configurent dans le JSON.
        </label>
      </col>
    </tab>

    <tab label="Rewards">
      <col class="tab-body">
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.currency">Monnaie</label>
          <label class="info-val">{{ rewards.cur }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.loot">Loot</label>
          <label class="info-val">{{ rewards.loot }}</label>
        </row>
        <row class="info-row">
          <label class="info-key" data-i18n="arcadia.admin.detail.archetypes">Archétypes</label>
          <label class="info-val">{{ archetypes }}</label>
        </row>
      </col>
    </tab>

  </tabs>

  <!-- ── Footer ── -->
  <row class="detail-footer">
    <label class="footer-id mono">{{ dungeon.id }}</label>
    <button class="btn-close" onclick="close" data-i18n="arcadia.admin.detail.close">Fermer</button>
  </row>

</col>

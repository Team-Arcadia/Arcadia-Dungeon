<col class="death-screen">
  <row class="death-header">
    <col class="death-title-block">
      <label class="death-kicker" data-i18n="arcadia.client.death.kicker">RESPAWN</label>
      <label class="death-title" data-i18n="arcadia.client.death.title">Mort temporaire</label>
    </col>
    <label class="death-badge">{{ t }}</label>
  </row>

  <col class="death-content">
    <label class="death-label" data-i18n="arcadia.client.death.return">Retour dans le donjon</label>
    <label class="death-countdown">{{ t }}</label>
    <label class="death-note" data-i18n="arcadia.client.death.note">Tu peux quitter la run avant le respawn.</label>
  </col>

  <row class="death-footer">
    <button class="danger-btn" onclick="quit" data-i18n="arcadia.client.death.quit">Quitter le donjon</button>
  </row>
</col>

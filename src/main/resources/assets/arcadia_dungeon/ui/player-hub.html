<div class="hub-screen arc-panel">
  <div class="header">
    <label class="title">Arcadia — Donjons</label>
  </div>
  <div class="content">
    <div class="dungeon-list" v-for="d in dungeon.count">
      <div class="dungeon-card" onclick="{{ d.onclick }}">
        <div class="card-info">
          <label class="dungeon-name">{{ d.name }}</label>
          <label class="dungeon-id mute">{{ d.id }}</label>
        </div>
        <label class="enter-hint">▶</label>
      </div>
    </div>
    <div class="empty-hint">
      <label class="mute">{{ hint }}</label>
    </div>
  </div>
  <div class="footer">
    <button onclick="close">Fermer</button>
  </div>
</div>

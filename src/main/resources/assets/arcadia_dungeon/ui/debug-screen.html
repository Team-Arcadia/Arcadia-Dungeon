<div class="debug-screen arc-panel">
  <div class="header">
    <label class="title">Debug — Run State</label>
  </div>
  <div class="content">
    <div class="row-item">
      <label class="key">Run ID</label>
      <label class="value truncated">{{ run.id }}</label>
    </div>
    <div class="row-item">
      <label class="key">Phase</label>
      <label class="value">{{ run.phase }}</label>
    </div>
    <div class="row-item">
      <label class="key">Salle</label>
      <label class="value">{{ run.room }}</label>
    </div>
    <div class="row-item">
      <label class="key">Wave</label>
      <label class="value">{{ run.wave }}</label>
    </div>
    <div class="row-item">
      <label class="key">Vies</label>
      <label class="value">{{ run.lives }}</label>
    </div>
    <div class="row-item">
      <label class="key">Temps</label>
      <label class="value">{{ run.elapsed }}</label>
    </div>
  </div>
  <div class="footer">
    <button onclick="close">Fermer</button>
  </div>
</div>

<col class="cfg-screen">
  <link rel="stylesheet" href="admin-global.css" />
  <row class="cfg-header">
    <label class="cfg-title">{{ cfg.title }}</label>
  </row>

  <col class="cfg-body">
    <label class="section-title" data-i18n="arcadia.admin.waves.title">Vagues</label>

    <virtual-list id="waveList" class="hub-vlist" v-for="w in waves.count" row-height="40">
      <row class="boss-row-card">
        <label class="row-idx">{{ w.waveIndex }}</label>
        <col class="row-info">
          <label class="boss-row-name">{{ w.waveName }}</label>
          <label class="boss-row-flags">{{ w.waveSummary }}</label>
        </col>
        <button class="btn-manage boss-manage-btn" onclick="{{ w.manageKey }}" data-i18n="arcadia.admin.common.manage">Gerer</button>
      </row>
    </virtual-list>

    <button class="btn-add"
            onclick="addWave"
            data-i18n="arcadia.admin.waves.add">+ Ajouter vague</button>
  </col>

  <row class="cfg-footer">
    <button class="btn-back" onclick="back" data-i18n="arcadia.admin.waves.back">Retour</button>
    <col class="spacer" />
    <button class="btn-save" onclick="save" data-i18n="arcadia.admin.waves.save">Sauvegarder</button>
  </row>
</col>

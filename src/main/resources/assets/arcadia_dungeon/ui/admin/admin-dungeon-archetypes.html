<col class="cfg-screen">
  <link rel="stylesheet" href="admin-global.css" />
  <row class="cfg-header">
    <label class="cfg-title" data-i18n="arcadia.admin.archetypes.title">Classes gratuites</label>
  </row>

  <col class="cfg-body">

    <virtual-list id="archList" class="hub-vlist" v-for="a in arch.count" row-height="72">
      <col class="list-row-col">

        <row class="sub-row">
          <col class="field-group flex-1">
            <label class="field-label" data-i18n="arcadia.admin.archetypes.id">ID classe</label>
            <input id="{{ a.archIdId }}" class="field-input wide"
                   value="{{ a.archId }}" oninput="{{ a.archIdKey }}"
                   placeholder="{{ t:arcadia.admin.placeholder.class_id }}" />
          </col>
          <col class="field-group flex-2">
            <label class="field-label" data-i18n="arcadia.admin.archetypes.name_key">Nom / cle i18n</label>
            <input id="{{ a.archNameId }}" class="field-input wide"
                   value="{{ a.archName }}" oninput="{{ a.archNameKey }}"
                   placeholder="{{ t:arcadia.admin.placeholder.class_name_key }}" />
          </col>
          <button class="btn-del" onclick="{{ a.archDelKey }}" data-i18n="arcadia.admin.common.delete.short">X</button>
        </row>

        <col class="field-group">
          <label class="field-label" data-i18n="arcadia.admin.archetypes.kit">Kit gratuit (items separes par virgule)</label>
          <input id="{{ a.archItemsId }}" class="field-input wide"
                 value="{{ a.archItems }}" oninput="{{ a.archItemsKey }}"
                 placeholder="{{ t:arcadia.admin.placeholder.class_kit }}" />
        </col>

      </col>
    </virtual-list>

    <button class="btn-add" onclick="addArch" data-i18n="arcadia.admin.archetypes.add">+ Ajouter classe gratuite</button>

  </col>

  <row class="cfg-footer">
    <button class="btn-back" onclick="back" data-i18n="arcadia.admin.common.back">Retour</button>
    <col class="spacer" />
    <button class="btn-save" onclick="save" data-i18n="arcadia.admin.common.save">Sauvegarder</button>
  </row>

</col>

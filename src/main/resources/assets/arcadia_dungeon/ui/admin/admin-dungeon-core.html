<col class="cfg-screen">
  <link rel="stylesheet" href="admin-global.css" />
  <!-- â”€â”€ Header â”€â”€ -->
  <row class="cfg-header">
    <label class="cfg-title">{{ cfg.title }}</label>
  </row>

  <!-- â”€â”€ Body â”€â”€ -->
  <col class="cfg-body">

    <!-- Lives -->
    <col class="field-group">
      <label class="field-label" data-i18n="arcadia.admin.core.lives">Vies</label>
      <input id="lives"
             class="field-input"
             placeholder="{{ t:arcadia.admin.placeholder.lives }}"
             value="{{ v.lives }}"
             oninput="onLives"
             tooltip-i18n="arcadia.admin.core.tooltip.lives" />
    </col>

    <row class="field-row">
      <col class="field-group">
        <label class="field-label" data-i18n="arcadia.admin.core.min_players">Joueurs min</label>
        <input id="minPlayers"
               class="field-input"
               placeholder="{{ t:arcadia.admin.placeholder.min_players }}"
               value="{{ v.minPlayers }}"
               oninput="onMinPlayers"
               tooltip-i18n="arcadia.admin.core.tooltip.min_players" />
      </col>
      <col class="field-group">
        <label class="field-label" data-i18n="arcadia.admin.core.max_players">Joueurs max</label>
        <input id="maxPlayers"
               class="field-input"
               placeholder="{{ t:arcadia.admin.placeholder.max_players }}"
               value="{{ v.maxPlayers }}"
               oninput="onMaxPlayers"
               tooltip-i18n="arcadia.admin.core.tooltip.max_players" />
      </col>
    </row>

    <!-- Lobby countdown -->
    <col class="field-group">
      <label class="field-label" data-i18n="arcadia.admin.core.lobby_countdown">Countdown lobby</label>
      <input id="lobbyCountdown"
             class="field-input"
             placeholder="{{ t:arcadia.admin.placeholder.seconds }}"
             value="{{ v.lobbyCountdown }}"
             oninput="onLobbyCountdown"
             tooltip-i18n="arcadia.admin.core.tooltip.lobby_countdown" />
    </col>

    <!-- Structure -->
    <col class="field-group">
      <label class="field-label" data-i18n="arcadia.admin.core.structure">RÃ©f. structure</label>
      <input id="structure"
             class="field-input wide"
             placeholder="{{ t:arcadia.admin.placeholder.structure }}"
             value="{{ v.structure }}"
             oninput="onStructure"
             tooltip-i18n="arcadia.admin.core.tooltip.structure" />
    </col>

    <!-- Dimension -->
    <col class="field-group">
      <label class="field-label" data-i18n="arcadia.admin.core.dimension">Dimension</label>
      <input id="dimension"
             class="field-input wide"
             placeholder="{{ t:arcadia.admin.placeholder.dimension }}"
             autocomplete="{{ s.dimensions }}"
             value="{{ v.dimension }}"
             oninput="onDimension"
             tooltip-i18n="arcadia.admin.core.tooltip.dimension" />
    </col>

    <!-- Placement Y -->
    <col class="field-group">
      <label class="field-label" data-i18n="arcadia.admin.core.placementy">Y placement</label>
      <input id="placementy"
             class="field-input"
             placeholder="{{ t:arcadia.admin.placeholder.y }}"
             value="{{ v.placementY }}"
             oninput="onPlacementY"
             tooltip-i18n="arcadia.admin.core.tooltip.placementy" />
    </col>

  </col>

  <!-- â”€â”€ Footer â”€â”€ -->
  <row class="cfg-footer">
    <button class="btn-back"
            onclick="back"
            data-i18n="arcadia.admin.core.back">â† Retour</button>
    <col class="spacer" />
    <button class="btn-save"
            onclick="save"
            data-i18n="arcadia.admin.core.save">âœ” Sauvegarder</button>
  </row>

</col>

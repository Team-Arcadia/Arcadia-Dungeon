name: Release

# A version tag (v1.4.2) builds every target and publishes their jars in one GitHub release.
on:
  workflow_run:
    workflows: [ Build ]
    types: [ completed ]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: arcadia-dungeon-*
          path: jars
          merge-multiple: true
      - name: Write release notes
        run: |
          tag=${{ github.event.workflow_run.head_branch }}
          {
            echo "## Arcadia Dungeon ${tag#v}"
            echo
            echo "One jar per loader and Minecraft version: arcadia-dungeon-<loader>-<minecraft version>-<version>.jar."
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for full details."
          } > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          body_path: RELEASE_NOTES.md
          files: jars/*.jar
